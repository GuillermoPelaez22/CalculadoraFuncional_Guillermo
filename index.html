<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <main clas="contenedor">
        <section class="calculadora">
            <h1>Calculadora</h1>
            
            <!--Pantalla-->
            <div class="pantalla">
                <div id="operacion"></div>
                <div id="resultado">0</div>
            </div>

            <!--Botones-->
            <div class="teclado">

                <!--Primera fila -->
                <button class="btn funcion" data-action="clear">AC</button>
                <button class="btn funcion" data-action="backspace">⌫</button>
                <button class="btn funcion" data-action="porciento">%</button>
                <button class="btn funcion" data-action="÷">÷</button>

                <!--Segunda fila-->
                <button class="btn numero" data-value="7">7</button>
                <button class="btn numero" data-value="8">8</button>
                <button class="btn numero" data-value="9">9</button>
                <button class="btn operador" data-value="x">x</button>

                <!--Tercera fila-->
                <button class="btn numero" data-value="4">4</button>
                <button class="btn numero" data-value="5">5</button>
                <button class="btn numero" data-value="6">6</button>
                <button class="btn numero" data-value="-">-</button>

                <!--Cuarta fila-->
                <button class="btn numero" data-value="1">1</button>
                <button class="btn numero" data-value="2">2</button>
                <button class="btn numero" data-value="3">3</button>
                <button class="btn operador" data-value="+">+</button>

                <!--Quinta fila-->
                <button class="btn funcion" data-action="sqrt">√</button>
                <button class="btn numero" data-value="0">0</button>
                <button class="btn numero" data-value=".">.</button>
                <button class="btn igual" data-action="igual">=</button>

                <!--Operaciones extra-->
                <button class="btn funcion" data-action="cuadrado">x²</button>
                <button class="btn funcion" data-action="signo">+/-</button>
                <button class="btn funcion" data-action="reciproca">1/x</button>
                <button class="btn operador" data-value="^">xʸ</button>

            </div>

            <div class="leyenda">
                <span class="par">Pares</span>
                <span class="impar">Impares</span>
                <span class="otros">Operaciones</span>
            </div>

        </section>

    </main>

    <script src="js/calculadora.js"></script>
    
</body>
</html>
